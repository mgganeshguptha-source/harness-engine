# =============================================================================
# harness-engine/.github/workflows/harness.yml
# THE REUSABLE ENGINE WORKFLOW  (lives in the harness-engine repo)
#
# Runs in the CALLER's repo context. Supplies the engine + orchestration.
#
# THREE CHECKOUTS (a reusable workflow brings none of its own files):
#   1. the CALLER's service repo  -> ./service   (the code the harness works on)
#   2. this harness-engine repo   -> ./engine    (the Python engine under harness/)
#   3. copilot-toolkit            -> ./toolkit   (shared skills + instructions)
#
# CENTRAL TOOLKIT MODEL: skills/instructions are NOT committed to service repos
# (they stay gitignored there). The workflow copies them from the central toolkit
# into service/.github/ at run time, so the engine finds them at repo_root/.github
# — present for the run, never committed. One source of truth; update once.
#
# FLAT IMPORTS: engine modules import each other flatly (no __init__.py), so run.py
# is executed from INSIDE engine/harness (working-directory); --repo is ../../service.
# =============================================================================
name: Harness (engine)

on:
  workflow_call:
    inputs:
      feature_id:
        description: "Story / feature id to run"
        required: true
        type: string
      java-version:
        required: false
        default: "17"
        type: string
      python-version:
        required: false
        default: "3.13"
        type: string
      node-version:
        required: false
        default: "20"
        type: string
      engine_ref:
        description: "Tag/branch of harness-engine to run"
        required: false
        default: "v1"
        type: string
      toolkit_ref:
        description: "Tag/branch of copilot-toolkit to load (skills + instructions)"
        required: false
        default: "main"
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        description: "Fine-grained PAT on a Copilot-licensed seat (Contents RW, PRs RW)"
        required: true

jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --- 1. the CALLER's service repo -> ./service ---
      - name: Checkout target service repo
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 0

      # --- 2. THIS engine repo -> ./engine ---
      - name: Checkout harness-engine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/harness-engine
          ref: ${{ inputs.engine_ref }}
          path: engine

      # --- 3. the central toolkit -> ./toolkit (skills + instructions) ---
      - name: Checkout copilot-toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/copilot-toolkit
          ref: ${{ inputs.toolkit_ref }}
          path: toolkit
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}   # needed: toolkit is a separate private repo

      # --- 3b. place toolkit skills/instructions into the service checkout ---
      # The engine loads capability from <service>/.github/skills and
      # <service>/.github/instructions. We copy them in for THIS run only — they
      # are never committed back, so the central-toolkit model is preserved.
      - name: Load toolkit into service workspace
        run: |
          mkdir -p service/.github
          if [ -d toolkit/skills ]; then
            cp -r toolkit/skills service/.github/
          fi
          if [ -d toolkit/instructions ]; then
            cp -r toolkit/instructions service/.github/
          fi
          echo "Loaded skills/instructions from copilot-toolkit@${{ inputs.toolkit_ref }}"

      # --- 4. toolchains ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # --- 5. install deps + Copilot CLI ---
      - name: Install harness dependencies
        run: pip install -r engine/requirements.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      # --- 6. run the harness (from inside engine/harness for flat imports) ---
      - name: Initialize run
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py init \
            --repo ../../service \
            --feature "${{ inputs.feature_id }}"

      - name: Autorun (all phases)
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "harness-bot"
          GIT_AUTHOR_EMAIL: "harness-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "harness-bot"
          GIT_COMMITTER_EMAIL: "harness-bot@users.noreply.github.com"
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py autorun --repo ../../service

      # --- 7. collect audit files into service/audit/ (local copy) ---
      - name: Collect audit
        if: always()
        working-directory: engine/harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/engine/harness"
          python run.py collect-audit --repo ../../service || true

      # --- 8. push the audit trail to a branch — ALWAYS (success OR halt) ---
      # This is what makes the run inspectable: context.md, capability-manifest,
      # run-summary land on harness-audit/<feature>-<run_id> every time.
      - name: Commit audit trail to a branch (always)
        if: always()
        working-directory: service
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          FEATURE="${{ inputs.feature_id }}"
          AUDIT_BRANCH="harness-audit/${FEATURE}-${{ github.run_id }}"
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          git checkout -b "$AUDIT_BRANCH"
          git add audit/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audit files to commit (collect-audit produced nothing)."
          else
            STATUS=$(python3 -c "import json,glob; f=sorted(glob.glob('audit/*/*/run-summary.json')); print(json.load(open(f[-1]))['status'] if f else 'unknown')" 2>/dev/null || echo unknown)
            git commit -m "Harness audit [$FEATURE] status=$STATUS (run ${{ github.run_id }})"
            git push origin "$AUDIT_BRANCH"
            echo "::notice title=Audit trail retained::Branch $AUDIT_BRANCH (status=$STATUS)"
          fi

      # --- 9. raise the code PR — ONLY on success ---
      - name: Open pull request with the change (success only)
        if: success()
        working-directory: service
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          FEATURE="${{ inputs.feature_id }}"
          BRANCH="harness/${FEATURE}-${{ github.run_id }}"
          git config user.name "harness-bot"
          git config user.email "harness-bot@users.noreply.github.com"
          # return to the checked-out commit first (audit step left us on the audit branch)
          git checkout "${{ github.sha }}" 2>/dev/null || git checkout main
          git checkout -b "$BRANCH"
          git add -A 2>/dev/null || true
          git commit -m "Harness: $FEATURE" || echo "nothing to commit"
          git push origin "$BRANCH"
          if [ -f .harness/pr-body.md ]; then
            gh pr create --title "Harness: $FEATURE" --body-file .harness/pr-body.md --base main --head "$BRANCH" || echo "PR create skipped"
          else
            gh pr create --title "Harness: $FEATURE" --body "Automated harness change for $FEATURE" --base main --head "$BRANCH" || echo "PR create skipped"
          fi
